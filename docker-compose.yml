networks:
  default:
    name: mainNetwork
    external: true

services:
  webServer:
    image: nginx:stable
    container_name: GFMS-App
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/gfms
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpservice
      - database

  phpservice:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: GFMS-Php
    volumes:
      - ./src:/var/www/gfms
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=gfms
      - DB_USERNAME=gfms_user
      - DB_PASSWORD=Mmsu2026Secure!
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: GFMS-DB
    ports:
	- "3307:3306"
    environment:
      MYSQL_DATABASE: gfms
      MYSQL_USER: gfms_user
      MYSQL_PASSWORD: Mmsu2026Secure!
      MYSQL_ROOT_PASSWORD: RootPass2026Secure!
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gfms_user", "-pgfms_pass"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:


